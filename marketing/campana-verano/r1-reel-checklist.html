<!DOCTYPE html>
<html lang="es-AR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>R1 · Checklist de verano</title>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../campana-mundos/comun.css">
    <link rel="stylesheet" href="verano.css">
    <style>
        /* Reel 1080 × 1920, 14 s: el checklist de verano en tres productos, cada uno con su foto y su precio.
           Todo se calcula en render(t): sirve para verlo en el navegador y para grabarlo cuadro por cuadro. */
        .art { background: var(--forest-900); }
        .esc { inset: 0; overflow: hidden; opacity: 0; }
        .esc > * { position: absolute; }
        .bg { inset: -40px; background-size: cover; background-position: center; }
        .velo { inset: 0; }
        .num { left: 60px; top: 300px; width: 130px; height: 130px; border-radius: 40px; background: var(--sun); color: var(--forest-900); display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 84px; box-shadow: 0 18px 36px rgba(0,0,0,.3); }
        .que { left: 60px; right: 60px; top: 460px; font-size: 104px; }
        .que em { font-size: 120px; }
        .esc .card { left: 240px; top: 860px; width: 600px; padding: 24px 24px 28px; }
        .esc .card .foto { height: 380px; }
        .esc .card .foto img { max-height: 360px; }
        .esc .card .nom { font-size: 28px; min-height: 0; }
        .esc .card .precio { font-size: 66px; }
        .esc .card .precio s { font-size: 26px; }
        .esc .card .off { font-size: 40px; padding: 10px 18px; }
        #a .titular { left: 60px; right: 60px; top: 330px; font-size: 150px; }
        #a .titular em { font-size: 170px; }
        #a .sub { left: 64px; top: 720px; font-size: 44px; font-weight: 700; text-shadow: 0 3px 18px rgba(0,0,0,.4); }
        #e { background: radial-gradient(90% 55% at 50% 35%, #0E5A42 0%, #0A3D2E 50%, #062A20 100%); }
        #e .titular { left: 0; right: 0; top: 330px; text-align: center; font-size: 120px; }
        #e .titular em { font-size: 132px; }
        #e .prods { left: 0; right: 0; top: 640px; height: 460px; display: flex; justify-content: center; align-items: flex-end; gap: 30px; }
        #e .prods img { height: 380px; filter: drop-shadow(0 26px 26px rgba(0,0,0,.45)); }
        #e .prods img:nth-child(2) { height: 440px; }
        #e .datos { left: 0; right: 0; top: 1160px; text-align: center; font-size: 40px; font-weight: 700; line-height: 1.4; }
        #e .datos b { color: var(--sun); }
        #e .st-cta { top: 1330px; }
        #e .sello { left: 0; right: 0; top: 236px; text-align: center; }
        #e .sello .fg-sello { font-size: 46px; }
        .marca { left: 60px; top: 220px; }
        .marca .fg-sello { font-size: 40px; }
    </style>
</head>
<body>
<div class="stage">
<article class="art" data-w="1080" data-h="1920" data-dur="14" data-cover="2.2" aria-label="Reel: checklist de verano. Protector solar, repelente y bruma, con sus precios">
    <section class="esc" id="a">
        <div class="bg" style="background-image:url(img/fotos/1501426026826-31c667bdf23d.jpg)"></div>
        <div class="velo" style="background:linear-gradient(180deg,rgba(3,45,66,.7) 0%,rgba(3,45,66,.05) 45%,rgba(2,30,42,.6) 100%)"></div>
        <div class="marca"><span class="fg-sello claro" data-sello></span></div>
        <h1 class="titular">Checklist<br><em>de verano.</em></h1>
        <p class="sub">☀ 3 cosas que no pueden faltar</p>
    </section>
    <section class="esc" id="b">
        <div class="bg" style="background-image:url(img/fotos/1520454974749-611b7248ffdb.jpg)"></div>
        <div class="velo" style="background:linear-gradient(180deg,rgba(3,45,66,.72) 0%,rgba(3,45,66,.1) 40%,rgba(2,30,42,.55) 100%)"></div>
        <div class="num">1</div><h2 class="titular que">Protector<br><em>solar.</em></h2>
        <i data-card="anthelios"></i>
    </section>
    <section class="esc" id="c">
        <div class="bg" style="background-image:url(img/fotos/1414609245224-afa02bfb3fda.jpg)"></div>
        <div class="velo" style="background:linear-gradient(180deg,rgba(40,14,4,.7) 0%,rgba(40,14,4,.1) 40%,rgba(10,8,20,.6) 100%)"></div>
        <div class="num">2</div><h2 class="titular que">Repelente<br><em>para la tarde.</em></h2>
        <i data-card="offextra"></i>
    </section>
    <section class="esc" id="d">
        <div class="bg" style="background-image:url(img/fotos/1505944270255-72b8c68c6a70.jpg)"></div>
        <div class="velo" style="background:linear-gradient(180deg,rgba(60,30,0,.66) 0%,rgba(60,30,0,.1) 40%,rgba(60,30,0,.5) 100%)"></div>
        <div class="num">3</div><h2 class="titular que">Bruma para<br><em>refrescar.</em></h2>
        <i data-card="bruma"></i>
    </section>
    <section class="esc" id="e">
        <div class="sello"><span class="fg-sello claro" data-sello></span></div>
        <h2 class="titular">Todo en<br><em>FarmaGlass.</em></h2>
        <div class="prods"><img src="img/productos/off-extra.webp" alt=""><img src="img/productos/parque-22.webp" alt=""><img src="img/productos/plaza-108.webp" alt=""></div>
        <p class="datos">Llega en <b>2 horas</b> · CABA y GBA<br>Envío gratis desde <b>$ 15.000</b></p>
        <div class="st-cta"><span class="cta-bio">Pedilo: link en la bio<svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-arrow"/></svg></span></div>
    </section>
</article>
</div>
<script src="../../productos-reales.js"></script>
<script src="verano.js"></script>
<script>
(function () {
    V.init();
    const $ = s => document.querySelector(s);
    const art = $('.art'), DUR = +art.dataset.dur, COVER = +art.dataset.cover;
    const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
    const seg = (t, a, b) => clamp((t - a) / (b - a));
    const eo = x => 1 - Math.pow(1 - x, 3);
    const eb = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
    // escena: [id, entra, sale]
    const ESC = [['a', 0, 3.1], ['b', 2.9, 5.9], ['c', 5.7, 8.7], ['d', 8.5, 11.5], ['e', 11.3, 99]];
    function render(t) {
        ESC.forEach(([id, a, b]) => {
            const el = $('#' + id), x = seg(t, a, b);
            el.style.opacity = Math.min(a === 0 ? 1 : seg(t, a, a + .3), 1 - seg(t, b - .3, b)).toFixed(3);
            const bg = el.querySelector('.bg'); if (bg) bg.style.transform = `scale(${(1.04 + .1 * x).toFixed(4)}) translateY(${(-20 * x).toFixed(1)}px)`;
            const n = el.querySelector('.num'), h = el.querySelector('h1, h2'), c = el.querySelector('.card');
            const p1 = eo(seg(t, a + .15, a + .65)), p2 = eb(seg(t, a + .45, a + 1.05));
            if (n) n.style.transform = `scale(${(.4 + .6 * eb(seg(t, a + .1, a + .5))).toFixed(3)})`;
            if (h) { h.style.opacity = p1; h.style.transform = `translateY(${Math.round(50 * (1 - p1))}px)`; }
            if (c) { c.style.opacity = clamp(seg(t, a + .45, a + .7)); c.style.transform = `translateY(${Math.round(260 * (1 - p2))}px) rotate(${(-3 * (1 - p2)).toFixed(2)}deg)`; }
        });
        const s = $('#a .sub'), ps = eo(seg(t, .7, 1.2)); s.style.opacity = ps; s.style.transform = `translateY(${Math.round(30 * (1 - ps))}px)`;
        const e0 = 11.3;
        document.querySelectorAll('#e .prods img').forEach((im, i) => { const p = eb(seg(t, e0 + .5 + i * .15, e0 + 1.1 + i * .15)); im.style.opacity = clamp(seg(t, e0 + .5 + i * .15, e0 + .7 + i * .15)); im.style.transform = `translateY(${Math.round(200 * (1 - p))}px)`; });
        [['#e .datos', e0 + 1.1], ['#e .st-cta', e0 + 1.4]].forEach(([q, a]) => { const p = eo(seg(t, a, a + .5)); $(q).style.opacity = p; $(q).style.transform = `translateY(${Math.round(30 * (1 - p))}px)`; });
    }
    window.__render = render;
    const q = new URLSearchParams(location.search);
    if (!q.has('export')) { const t0 = performance.now(); (function lazo() { render(Math.min(DUR, ((performance.now() - t0) / 1000) % (DUR + 1))); requestAnimationFrame(lazo); })(); }
    else if (!q.has('anim')) render(COVER);
})();
</script>
<script src="../campana-mundos/comun.js"></script>
</body>
</html>
