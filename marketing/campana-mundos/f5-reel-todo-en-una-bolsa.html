<!DOCTYPE html>
<html lang="es-AR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>F5 · Reel Todo en una bolsa</title>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="comun.css">
    <style>
        /* Reel 1080 × 1920, 10 s: la bolsa de FarmaGlass se llena con productos de las 4 farmacias.
           Sin animación (PNG y portada) se ve la bolsa llena. */
        .art { color: var(--cream);
            background:
                radial-gradient(60% 30% at 92% 4%, rgba(184, 240, 74, .22) 0%, rgba(184, 240, 74, 0) 70%),
                radial-gradient(60% 34% at 50% 62%, rgba(19, 154, 107, .55) 0%, rgba(19, 154, 107, 0) 70%),
                linear-gradient(170deg, #0A3D2E 0%, #062A20 46%, #041F17 100%); }
        .art::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle, rgba(246, 244, 236, .09) 1.6px, transparent 2.2px) 0 0 / 36px 36px; }

        .head { position: absolute; top: 190px; left: 64px; right: 64px; display: flex; justify-content: space-between; align-items: center; }
        .head .fg-sello { font-size: 46px; }
        .pill { padding: 12px 22px; border-radius: 999px; font-size: 24px; font-weight: 600; background: rgba(255,255,255,.08); border: 1.5px solid rgba(255,255,255,.16); }
        h1 { position: absolute; top: 300px; left: 64px; right: 40px; font-family: var(--f-display); font-weight: 800; font-size: 112px; line-height: .94; letter-spacing: -.04em; }
        h1 span { display: block; }
        h1 em { display: block; font-family: var(--f-serif); font-style: italic; font-weight: 400; font-size: 140px; color: var(--lime); letter-spacing: -.01em; }

        /* La bolsa: espalda, productos y frente, en ese orden */
        .bolsa { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
        .bolsa > svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
        .bolsa .back { z-index: 1; } .bolsa .front { z-index: 20; }
        .bolsa img.prod { position: absolute; z-index: 5; rotate: var(--r, 0deg); filter: drop-shadow(0 14px 18px rgba(0,0,0,.35)); }
        .p1 { left: 268px; top: 720px; height: 400px; width: 172px; --r: -10deg; z-index: 2 !important; }
        .p2 { left: 692px; top: 740px; height: 390px; width: 180px; --r: 13deg; z-index: 2 !important; }
        .p3 { left: 450px; top: 754px; height: 350px; width: 154px; --r: 3deg; z-index: 3 !important; }
        .p4 { left: 560px; top: 800px; height: 320px; width: 189px; --r: -4deg; z-index: 4 !important; }
        .p5 { left: 330px; top: 910px; height: 250px; width: 160px; --r: -15deg; }
        .p6 { left: 628px; top: 930px; height: 220px; width: 168px; --r: 12deg; }
        .p7 { left: 236px; top: 1000px; height: 160px; width: 268px; --r: -7deg; z-index: 6 !important; }
        .p8 { left: 520px; top: 1010px; height: 150px; width: 306px; --r: 7deg; z-index: 6 !important; }

        /* Categorías alrededor de la bolsa */
        .chip { position: absolute; z-index: 30; display: inline-flex; align-items: center; gap: 12px; padding: 10px 22px 10px 10px; border-radius: 999px; background: #fff; color: var(--fg-ink); font-weight: 700; font-size: 26px; white-space: nowrap; box-shadow: 0 16px 34px rgba(0,0,0,.35); }
        .chip svg { width: 46px; height: 46px; padding: 5px; border-radius: 14px; background: linear-gradient(160deg, #fff, #EEF1EA); box-shadow: 0 1px 2px rgba(16,38,31,.12); }
        .c1 { left: 40px; top: 780px; rotate: -5deg; }
        .c2 { right: 36px; top: 700px; rotate: 4deg; }
        .c3 { left: 28px; top: 1130px; rotate: 3deg; }
        .c4 { right: 30px; top: 1160px; rotate: -4deg; }
        .c5 { left: 60px; top: 1390px; rotate: -3deg; }
        .c6 { right: 40px; top: 1452px; rotate: 3deg; background: var(--lime); }

        .seal { position: absolute; z-index: 31; left: 820px; top: 860px; width: 210px; height: 210px; border-radius: 50%; display: grid; place-content: center; text-align: center; color: var(--forest-900); rotate: -10deg;
            background: radial-gradient(circle at 32% 26%, #FFE680 0%, var(--sun) 46%, var(--sun-deep) 100%); box-shadow: 0 18px 40px rgba(0, 0, 0, .35), inset 0 3px 0 rgba(255,255,255,.55); }
        .seal small { font-size: 17px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
        .seal b { font-family: var(--f-display); font-weight: 800; font-size: 82px; letter-spacing: -.05em; line-height: .95; }
        .seal b small { font-size: 46px; letter-spacing: -.02em; text-transform: none; }

        .tag { position: absolute; top: 1520px; left: 64px; right: 64px; text-align: center; font-size: 32px; line-height: 1.3; font-weight: 500; color: rgba(246,244,236,.86); z-index: 31; }
        .tag b { color: var(--cream); font-weight: 700; }
        .cta { position: absolute; z-index: 31; top: 1610px; left: 50%; translate: -50% 0; }

        /* ── ANIMACIÓN ── */
        @keyframes rise { from { opacity: 0; translate: 0 70px; } to { opacity: 1; translate: 0 0; } }
        @keyframes bagIn { from { translate: 0 900px; } to { translate: 0 0; } }
        @keyframes drop { 0% { translate: 0 -1500px; rotate: calc(var(--r) - 50deg); } 62% { translate: 0 26px; rotate: var(--r); } 80% { translate: 0 -14px; } 100% { translate: 0 0; rotate: var(--r); } }
        @keyframes pop { 0% { opacity: 0; scale: .3; } 70% { opacity: 1; scale: 1.08; } 100% { opacity: 1; scale: 1; } }
        @keyframes squash { 0%, 100% { scale: 1 1; } 40% { scale: 1.03 .95; } 70% { scale: .99 1.02; } }
        @keyframes ctaIn { from { opacity: 0; translate: -50% 40px; } to { opacity: 1; translate: -50% 0; } }

        .anim h1 span:nth-child(1) { animation: rise .7s cubic-bezier(.16,1,.3,1) .1s both; }
        .anim h1 span:nth-child(2) { animation: rise .7s cubic-bezier(.16,1,.3,1) .25s both; }
        .anim h1 em { animation: rise .8s cubic-bezier(.16,1,.3,1) .45s both; }
        .anim .head { animation: rise .6s ease 0s both; }
        .anim .bolsa { animation: bagIn .9s cubic-bezier(.16,1,.3,1) .5s both, squash .6s ease 5.95s; transform-origin: 540px 1500px; }
        .anim .bolsa img.prod { animation: drop .75s cubic-bezier(.4,0,.2,1) both; }
        .anim .p1 { animation-delay: 1.4s !important; } .anim .p2 { animation-delay: 1.95s !important; } .anim .p3 { animation-delay: 2.5s !important; } .anim .p4 { animation-delay: 3.05s !important; }
        .anim .p5 { animation-delay: 3.6s !important; } .anim .p6 { animation-delay: 4.15s !important; } .anim .p7 { animation-delay: 4.7s !important; } .anim .p8 { animation-delay: 5.25s !important; }
        .anim .chip { animation: pop .5s cubic-bezier(.34,1.56,.64,1) both; }
        .anim .c1 { animation-delay: 1.75s; } .anim .c2 { animation-delay: 2.3s; } .anim .c3 { animation-delay: 2.85s; } .anim .c4 { animation-delay: 3.95s; } .anim .c5 { animation-delay: 5.05s; } .anim .c6 { animation-delay: 5.6s; }
        .anim .seal { animation: pop .6s cubic-bezier(.34,1.56,.64,1) 6.3s both; }
        .anim .tag { animation: rise .7s cubic-bezier(.16,1,.3,1) 6.8s both; }
        .anim .cta { animation: ctaIn .7s cubic-bezier(.16,1,.3,1) 7.2s both; }
    </style>
</head>
<body>
<div class="stage">
<article class="art" data-w="1080" data-h="1920" data-dur="10" aria-label="Reel: todo lo de tu farmacia, en una bolsa">
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <defs>
            <linearGradient id="gd-green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5FE0A8"/><stop offset="1" stop-color="#0B7A55"/></linearGradient>
            <linearGradient id="gd-lime" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E2FF8F"/><stop offset="1" stop-color="#6FC21F"/></linearGradient>
            <linearGradient id="gd-coral" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF9A7A"/><stop offset="1" stop-color="#D62F2A"/></linearGradient>
            <linearGradient id="gd-sun" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE680"/><stop offset="1" stop-color="#F29A00"/></linearGradient>
            <linearGradient id="gd-sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8FD3FF"/><stop offset="1" stop-color="#2F6FE0"/></linearGradient>
            <linearGradient id="gd-violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C6A8FF"/><stop offset="1" stop-color="#6A3FD6"/></linearGradient>
            <linearGradient id="gd-pink" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFB8D9"/><stop offset="1" stop-color="#E04A8C"/></linearGradient>
            <linearGradient id="gd-shine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
            <linearGradient id="bag-front" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#139A6B"/><stop offset=".5" stop-color="#0B5D45"/><stop offset="1" stop-color="#0A3D2E"/></linearGradient>
            <linearGradient id="bag-side" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000" stop-opacity=".28"/><stop offset=".12" stop-color="#000" stop-opacity="0"/><stop offset=".88" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".3"/></linearGradient>
            <pattern id="kraft" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="none"/><path d="M0 0V14" stroke="#fff" stroke-opacity=".035" stroke-width="3"/></pattern>
        </defs>
        <symbol id="d-sparkle" viewBox="0 0 48 48"><path d="M22 4c1.4 9.6 5.4 13.6 15 15-9.6 1.4-13.6 5.4-15 15-1.4-9.6-5.4-13.6-15-15 9.6-1.4 13.6-5.4 15-15z" fill="url(#gd-violet)"/><path d="M38 28c.7 4.3 2.4 6 6 6.7-3.6.7-5.3 2.4-6 6.7-.7-4.3-2.4-6-6-6.7 3.6-.7 5.3-2.4 6-6.7z" fill="url(#gd-pink)"/></symbol>
        <symbol id="d-drop" viewBox="0 0 48 48"><path d="M24 4s15 15.5 15 26a15 15 0 0 1-30 0C9 19.5 24 4 24 4z" fill="url(#gd-sky)"/><ellipse cx="18" cy="28" rx="4" ry="7" fill="url(#gd-shine)" transform="rotate(-15 18 28)"/></symbol>
        <symbol id="d-baby" viewBox="0 0 48 48"><path d="M20 3h8l1.5 7h-11z" fill="url(#gd-sun)"/><rect x="15" y="10" width="18" height="6" rx="3" fill="url(#gd-pink)"/><rect x="13" y="16" width="22" height="29" rx="9" fill="url(#gd-sky)"/><rect x="16" y="30" width="16" height="12" rx="5" fill="#fff" opacity=".45"/><rect x="16" y="19" width="4" height="20" rx="2" fill="url(#gd-shine)"/></symbol>
        <symbol id="d-leaf" viewBox="0 0 48 48"><path d="M8 40C8 20 20 8 42 6c-1 22-13 34-34 34z" fill="url(#gd-lime)"/><path d="M8 40c8-10 16-18 26-24" stroke="#fff" stroke-width="2.5" stroke-linecap="round" fill="none" opacity=".85"/></symbol>
        <symbol id="d-pill" viewBox="0 0 48 48"><g transform="rotate(-45 24 24)"><rect x="5" y="15" width="38" height="18" rx="9" fill="#fff"/><path d="M24 15h10a9 9 0 0 1 0 18H24z" fill="url(#gd-coral)"/><path d="M24 15H14a9 9 0 0 0 0 18h10z" fill="url(#gd-green)"/><rect x="10" y="18" width="28" height="4" rx="2" fill="url(#gd-shine)"/></g></symbol>
        <symbol id="d-store" viewBox="0 0 48 48"><path d="M8 20v22h32V20" fill="url(#gd-green)"/><path d="M5 9h38l-3 11a5 5 0 0 1-10 0 5 5 0 0 1-10 0 5 5 0 0 1-10 0z" fill="url(#gd-sun)"/><rect x="20" y="30" width="8" height="12" rx="2" fill="#fff" opacity=".8"/></symbol>
    </svg>

    <header class="head"><span class="fg-sello claro" data-sello></span><span class="pill">Red de 4 farmacias</span></header>
    <h1><span>Todo lo de</span><span>tu farmacia,</span><em>en una bolsa.</em></h1>

    <div class="bolsa">
        <svg class="back" viewBox="0 0 1080 1920" aria-hidden="true">
            <path d="M380 1060 C 380 880, 700 880, 700 1060" stroke="#E9DCC0" stroke-width="20" fill="none" stroke-linecap="round"/>
            <path d="M380 1060 C 380 880, 700 880, 700 1060" stroke="#C9B48A" stroke-width="20" fill="none" stroke-linecap="round" stroke-dasharray="4 18" opacity=".7"/>
            <path d="M232 1040 L848 1040 L862 1090 L218 1090 Z" fill="#073326"/>
        </svg>
        <img class="prod p1" src="img/productos/plaza-12.webp" alt="">
        <img class="prod p2" src="img/productos/plaza-11.webp" alt="">
        <img class="prod p3" src="img/productos/norte-35.webp" alt="">
        <img class="prod p4" src="img/productos/plaza-21.webp" alt="">
        <img class="prod p5" src="img/productos/parque-41.webp" alt="">
        <img class="prod p6" src="img/productos/centro-104.webp" alt="">
        <img class="prod p7" src="img/productos/norte-36.webp" alt="">
        <img class="prod p8" src="img/productos/parque-116.webp" alt="">
        <svg class="front" viewBox="0 0 1080 1920" aria-hidden="true">
            <path d="M210 1080 L870 1080 L900 1480 Q 900 1500 880 1500 L200 1500 Q 180 1500 180 1480 Z" fill="url(#bag-front)"/>
            <path d="M210 1080 L870 1080 L900 1480 Q 900 1500 880 1500 L200 1500 Q 180 1500 180 1480 Z" fill="url(#kraft)"/>
            <path d="M210 1080 L870 1080 L900 1480 Q 900 1500 880 1500 L200 1500 Q 180 1500 180 1480 Z" fill="url(#bag-side)"/>
            <path d="M210 1080 L870 1080 L873 1122 L207 1122 Z" fill="#139A6B"/>
            <path d="M207 1122 L873 1122" stroke="#073326" stroke-opacity=".5" stroke-width="3"/>
            <path d="M330 1100 C 330 1010, 330 990, 332 980" stroke="#E9DCC0" stroke-width="20" fill="none" stroke-linecap="round"/>
            <path d="M750 1100 C 750 1010, 750 990, 748 980" stroke="#E9DCC0" stroke-width="20" fill="none" stroke-linecap="round"/>
            <circle cx="330" cy="1104" r="11" fill="#C9B48A"/><circle cx="750" cy="1104" r="11" fill="#C9B48A"/>
            <g transform="translate(262 1290)">
                <rect x="0" y="-58" width="116" height="116" rx="34" fill="#F6F4EC"/>
                <svg x="16" y="-42" width="84" height="84" viewBox="0 0 24 24"><path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z" fill="none" stroke="#0B5D45" stroke-width="2.6" stroke-linejoin="round"/></svg>
                <text x="140" y="27" font-family="Bricolage Grotesque, Inter, sans-serif" font-weight="800" font-size="80" letter-spacing="-2" fill="#F6F4EC">Farma<tspan fill="#B8F04A">Glass</tspan></text>
            </g>
            <text x="540" y="1420" text-anchor="middle" font-family="Inter, sans-serif" font-weight="600" font-size="26" letter-spacing="4" fill="#F6F4EC" fill-opacity=".7">LAS FARMACIAS DE TU BARRIO</text>
        </svg>
    </div>

    <span class="chip c1"><svg><use href="#d-sparkle"/></svg>Dermocosmética</span>
    <span class="chip c2"><svg><use href="#d-drop"/></svg>Cuidado personal</span>
    <span class="chip c3"><svg><use href="#d-leaf"/></svg>Nutrición</span>
    <span class="chip c4"><svg><use href="#d-baby"/></svg>Bebés</span>
    <span class="chip c5"><svg><use href="#d-pill"/></svg>Botiquín</span>
    <span class="chip c6"><svg><use href="#d-store"/></svg>De 4 farmacias</span>

    <p class="seal"><small>En tu puerta</small><b>2<small>h</small></b></p>
    <p class="tag">Desde las farmacias de tu barrio, <b>en tu puerta en 2 horas.</b></p>
    <span class="cta cta-bio">Pedí en el link de la bio<svg viewBox="0 0 24 24"><use href="#i-arrow"/></svg></span>
</article>
</div>
<script src="comun.js"></script>
</body>
</html>
